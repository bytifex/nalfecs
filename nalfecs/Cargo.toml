[package]
name = "nalfecs"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "The crate provides tools to create structure of arrays for game objects."
readme = "README.md"
keywords = ["soa", "structure-of-arrays", "game"]

[dependencies]
parking_lot.workspace = true

macros = { path = "../macros" }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
rand = { version = "0.8.5", features = ["small_rng"] }
trybuild = "1.0.116"
